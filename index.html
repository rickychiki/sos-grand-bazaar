<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <title>Recipe Mind Map</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }

    svg {
      width: 100vw;
      height: 100vh;
      background: #fafafa;
    }

    .node text {
      font-size: 12px;
      pointer-events: none;
    }

    .node circle {
      stroke: #333;
      stroke-width: 1.2px;
      cursor: pointer;
    }

    .tooltip {
      position: absolute;
      pointer-events: none;
      background: #fff;
      border: 1px solid #aaa;
      border-radius: 4px;
      padding: 5px 8px;
      opacity: 0;
    }

    /* 🔧 設定面板 */
    #settings-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: 500px;
      height: 100%;
      background: rgba(30, 30, 30, 0.95);
      color: #fff;
      transform: translateX(100%);
      transition: transform 0.3s ease;
      z-index: 999;
      font-family: sans-serif;
      box-shadow: -4px 0 10px rgba(0, 0, 0, 0.4);
    }

    /* ⚙️ 小按鈕 */
    #settings-panel .panel-toggle {
      position: absolute;
      left: -36px;
      top: 20px;
      width: 36px;
      height: 36px;
      background: #444;
      color: #fff;
      border-radius: 6px 0 0 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 20px;
      z-index: 1000;
      box-shadow: -2px 2px 6px rgba(0, 0, 0, 0.3);
    }

    /* 面板內容 */
    #settings-panel .panel-content {
      padding: 16px;
      padding-bottom: 32px;
       box-sizing: border-box;
      overflow-y: auto;
      height: 100%;
    }

    /* 打開狀態 */
    #settings-panel.open {
      transform: translateX(0);
    }

    /* 按鈕樣式 */
    #settings-panel button {
      margin: 3px;
      padding: 6px 10px;
      border: none;
      border-radius: 4px;
      background: #666;
      color: #fff;
      cursor: pointer;
    }

    #settings-panel button:hover {
      background: #888;
    }

    #settings-panel button.active {
      background: #f90;
      color: #000;
      font-weight: bold;
    }

  </style>
</head>

<body>

  <svg></svg>
  <!-- 右側設定面板 -->
  <div id="settings-panel">
    <div class="panel-toggle">⚙️</div>
    <div class="panel-content">
      <div class="filter-section">
        <div id="filters"></div>
      </div>
      <h4 class="language">語言</h4>
      <div>
        <button id="lang-en">English</button>
        <button id="lang-zh-Hant">繁體中文</button>
        <button id="lang-zh-Hans">简体中文</button>
        <button id="lang-jp">日本語</button>
      </div>
      <hr>
    </div>
  </div>

  <div class="tooltip"></div>

  <script src="./data/recipes.js"></script>
  <script src="./data/processed-goods.js"></script>
  <script src="./data/groups.js"></script>
  <script src="./data/ingredients.js"></script>
  <script src="./data/i18n.js"></script>
  <script src="./main.js"></script>
</body>

</html>
